name: CI

on:
  push:
    branches: [main]
  pull_request:

# H14: the token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (must report 0 issues)
        run: flutter analyze
      - name: Index check (every query that needs a composite index has one)
        run: node tool/check_indexes.js
      - name: Unit and widget tests, in batches of 30 files, one at a time
        run: |
          set -e
          find test -name '*_test.dart' | sort > tests.txt
          split -l 30 -d tests.txt batch_
          for b in batch_*; do
            echo "== $b"
            flutter test --concurrency=1 $(cat "$b")
          done

  functions:
    name: Functions lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Lint and unit tests
        working-directory: functions
        run: npm test

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firestore_rules_test/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: firestore_rules_test
        run: npm ci
      - name: Rules tests (Firestore + Storage emulators)
        working-directory: firestore_rules_test
        run: npm test
